spring.application.name=ComandaNet

# MySQL (valores podem ser substituídos por variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/comandanet?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O Hibernate cria/atualiza as tabelas a partir das entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict\n